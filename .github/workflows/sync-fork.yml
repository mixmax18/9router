name: Sync fork with upstream

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream master into fork
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=master

      - name: Mirror upstream tags one by one
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git clone --quiet --no-checkout --filter=blob:none \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git remote add upstream https://github.com/decolua/9router.git
          git fetch --quiet upstream --tags
          for t in $(git tag --list 'v*'); do
            if ! git ls-remote --exit-code --tags origin "refs/tags/${t}" >/dev/null 2>&1; then
              echo "pushing ${t}"
              git push origin "refs/tags/${t}"
            fi
          done
